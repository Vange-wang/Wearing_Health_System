server:
  host: 0.0.0.0
  port: 8710
device_auth:
  mode: required
  token_env: DEVICE_TOKEN
asr:
  model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
  sample_rate: 16000
  streaming_model_dir: models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20
tts:
  primary: edge
  edge_voice: zh-CN-XiaoxiaoNeural
  edge_probe_timeout: 3
vad:
  enabled: true
  rms_threshold: 0.005
  min_speech_frames: 10
llm:
  api_server_url: http://127.0.0.1:8780/v1
  model: hermes-agent
  api_key_env: HERMES_API_KEY
lightweight:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  user_profile_path: ~/.hermes/memories/USER.md
rag:
  knowledge_dir: knowledge
  top_k: 3
  score_threshold: 1.0
memory:
  api_url: http://127.0.0.1:8781/api/v1/memory
  inject_budget: 6144
  file_path: ~/.hermes/memories/MEMORY.md
router:
  tool_keywords: [查快递, 写文件, 发邮件, 定时, 搜网页, 搜索, 查天气, 帮我查, 天气, 新闻, 快递, 股票, 股价, 路况, 彩票, 汇率, 查一下, 查查, 查下, 看一下, 看看, 看下, 找一下, 找找, 找下, 怎么样, 的情况, 如何, 好不好, 是什么, 了解下, 介绍下]
  skill_keywords: []
  # 确定性当前数值查询短语；裸字段名不得作为 DATA 子串路由条件。
  data_keywords: [心率多少, 心率是多少, 心率怎么样, 心率如何, 心率咋样, 血氧多少, 血氧是多少, 血氧怎么样, 血氧如何, 血氧咋样, 心率血氧, 心率跟血氧, 心率和血氧, 测一下心率, 测一下血氧, 查一下心率, 查一下血氧, 血压多少, 血压是多少]
  # ASR 近音词归一（血氧同音误识别 → 归一后 DATA 查询命中；血压语义不同不归一）
  asr_normalize:
    血阳: 血氧
    雪阳: 血氧
    学养: 血氧
    学样: 血氧
pipeline:
  sentence_max_chars: 50
  max_frame_bytes: 8388608
  stream_idle_timeout_seconds: 5
  comfort_text: 好的，我查一下。
  sentence_gap_ms: 300
  acknowledgements:
    query: [稍等，我帮你查一下, 好的，这就帮你查，请稍等]
health:
  hr_high: 100
  hr_low: 50
  hr_low_night: 45
  spo2_low: 95
  night_start: 23
  night_end: 6
  alert_consecutive: 3
  alert_cooldown_s: 600
  data_stale_seconds: 60
  # P4 微信预警推送：接收方为子女/监护人微信（hermes send -t weixin:<chat_id>）
  wechat_chat_id: ""  # local env only
  wechat_chat_id_env: WECHAT_CHAT_ID
  wechat_push_enabled: true
  wechat_daily_limit: 5
log:
  level: INFO
