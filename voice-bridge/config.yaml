server:
  host: 0.0.0.0
  port: 8710
asr:
  model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
  sample_rate: 16000
  streaming_model_dir: models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20
tts:
  primary: edge
  edge_voice: zh-CN-XiaoxiaoNeural
  fallback: piper
  piper_model: models/piper/zh_CN-huayan-medium.onnx
  piper_config: models/piper/zh_CN-huayan-medium.onnx.json
  edge_probe_timeout: 3
vad:
  enabled: true
  rms_threshold: 0.005
  min_speech_frames: 10
llm:
  api_server_url: http://127.0.0.1:8780/v1
  model: hermes-agent
  api_key_env: HERMES_API_KEY
lightweight:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  user_profile_path: ~/.hermes/memories/USER.md
rag:
  knowledge_dir: knowledge
  top_k: 3
  score_threshold: 0.0
router:
  tool_keywords: [查快递, 写文件, 发邮件, 定时, 搜网页, 搜索, 查天气, 帮我查]
  skill_keywords: []
pipeline:
  sentence_max_chars: 50
  max_frame_bytes: 8388608
  comfort_text: 好的，我查一下。
log:
  level: INFO
